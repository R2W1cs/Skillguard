[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillguard"
version = "0.3.0"
description = "Open-source security scanner for AI Agent Skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "SkillGuard Contributors" }]
keywords = ["security", "agent-skills", "static-analysis", "sarif", "prompt-injection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "click>=8.1.7",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
sandbox = ["docker>=7.0.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
  "build>=1.2.0",
  "pip-audit>=2.7.0",
  "docker>=7.0.0",
]

[project.scripts]
skillguard = "skillguard.cli:main"

[project.urls]
Homepage = "https://github.com/skillguard/skillguard"
Documentation = "https://github.com/skillguard/skillguard#readme"
Issues = "https://github.com/skillguard/skillguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["skillguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "security: adversarial and security-focused tests",
  "integration: end-to-end scan workflows",
]

[tool.coverage.run]
source = ["skillguard"]
branch = true
omit = ["skillguard/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108", "S110", "SIM115"]
"tests/fixtures/**/*.py" = ["E", "F", "S", "SIM"]
"benchmarks/**/*.py" = ["S"]
"scripts/**/*.py" = ["S310"]
"skillguard/sandbox/docker_runner.py" = ["S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["skillguard"]
exclude = ["tests/fixtures/", "benchmarks/"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
