# Example: add this as .github/workflows/skillguard.yml in a skills repository.
name: Scan Agent Skills

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "**/SKILL.md"

permissions:
  contents: read
  security-events: write

jobs:
  skillguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install SkillGuard
        # Prefer a pinned GitHub ref until you verify the PyPI project ownership.
        run: pip install "skillguard@git+https://github.com/R2W1cs/Skillguard.git@v0.3.0"
      - name: Scan
        run: |
          skillguard scan ./skills --format sarif --output skillguard.sarif --fail-on high --quiet
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80b # v3.28.10
        with:
          sarif_file: skillguard.sarif
