name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Type check
        run: mypy skillguard

      - name: Tests with coverage
        run: pytest --cov=skillguard --cov-report=term-missing --cov-fail-under=85

      - name: Docs build
        run: mkdocs build --strict

      - name: Build package
        run: python -m build

      - name: Inspect package metadata URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, zipfile, re
          dist = Path("dist")
          texts = []
          for p in dist.glob("*.tar.gz"):
              with tarfile.open(p) as tf:
                  for m in tf.getmembers():
                      if m.name.endswith("PKG-INFO"):
                          texts.append(tf.extractfile(m).read().decode())
          for p in dist.glob("*.whl"):
              with zipfile.ZipFile(p) as zf:
                  for name in zf.namelist():
                      if name.endswith("METADATA"):
                          texts.append(zf.read(name).decode())
          blob = "\n".join(texts)
          assert "https://github.com/R2W1cs/Skillguard" in blob, blob[:500]
          assert "github.com/skillguard/skillguard" not in blob
          print("package metadata URLs OK")
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install and audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip-audit --path .
