# Reusable workflow — scan Agent Skills in a consumer repository.
# Example caller:
#   jobs:
#     scan:
#       uses: skillguard/skillguard/.github/workflows/skillguard-scan.yml@v0.3.0
#       with:
#         path: skills/
#         fail-on: high

name: SkillGuard Scan

on:
  workflow_call:
    inputs:
      path:
        description: Path to a skill or skills directory
        required: true
        type: string
      fail-on:
        description: Severity threshold for CI failure
        required: false
        type: string
        default: high
      upload-sarif:
        description: Upload SARIF to GitHub Code Scanning
        required: false
        type: boolean
        default: true
      baseline-report:
        description: Optional prior JSON report path for regression compare
        required: false
        type: string
        default: ""
      fail-on-introduced:
        description: Severity for regression compare failures
        required: false
        type: string
        default: high

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install SkillGuard
        run: |
          python -m pip install --upgrade pip
          pip install skillguard==0.3.0

      - name: Run SkillGuard (JSON + SARIF)
        id: scan
        continue-on-error: true
        run: |
          set +e
          skillguard scan "${{ inputs.path }}" \
            --format json \
            --output skillguard-report.json \
            --fail-on "${{ inputs.fail-on }}" \
            --quiet
          echo "scan_exit=$?" >> "$GITHUB_OUTPUT"
          skillguard scan "${{ inputs.path }}" \
            --format sarif \
            --output skillguard-results.sarif \
            --quiet || true

      - name: Fail on severity threshold
        if: ${{ steps.scan.outputs.scan_exit != '0' && inputs.baseline-report == '' }}
        run: exit ${{ steps.scan.outputs.scan_exit }}

      - name: Regression compare
        if: ${{ inputs.baseline-report != '' }}
        run: |
          skillguard compare "${{ inputs.baseline-report }}" skillguard-report.json \
            --fail-on-introduced "${{ inputs.fail-on-introduced }}" \
            --output skillguard-compare.json

      - name: Upload SARIF
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80b # v3.28.10
        with:
          sarif_file: skillguard-results.sarif
